# Resource override for the DeathStarBench socialnetwork chart, used for all
# Component 1, 2 and 3 runs (analysis/PREREGISTRATION.md, Component 1
# amendment item 2).
#
# The chart default (100m CPU / 128Mi, requests equal to limits) OOMKilled the
# mongodb and redis pods and CPU-throttled every service in pilot runs, with
# baseline error rates of 0-29%. The CPU limit is 1000m because the
# single-threaded redis pods saturated a 500m limit, which produced
# seconds-scale p99 latency. 28 pods request 2.8 CPU and 7Gi in total.
global:
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
