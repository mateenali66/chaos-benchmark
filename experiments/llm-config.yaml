# Amazon Bedrock configuration for Components 3 (fault selection) and 4
# (hypothesis generation), used for every campaign and generation run.
# Do not edit: changing it breaks comparability with the collected data.

region: ca-central-1

models:
  - arm: llm-claude
    model_id: global.anthropic.claude-sonnet-5   # inference profile; direct ID rejects on-demand invocation in ca-central-1
    provider: Anthropic
  - arm: llm-llama
    model_id: meta.llama3-70b-instruct-v1:0
    provider: Meta
  - arm: llm-mistral
    model_id: mistral.mistral-large-2402-v1:0
    provider: Mistral

component3_selection:
  temperature: 0.2
  max_tokens: 1024
  # Bedrock has no sampling seed for all three providers, so every request
  # and response is logged to campaigns/{arm}/campaign-N/llm-transcript.jsonl.
  # Prompt template: scripts/prompts/selection.txt.

component4_hypothesis:
  temperature: 0.7
  max_tokens: 2048
  samples_per_candidate: 5
  # Prompt template: scripts/prompts/hypothesis.txt. Output must validate
  # against scripts/prompts/hypothesis-schema.json. An invalid generation is
  # re-prompted, up to 3 attempts per sample, and every attempt is logged.
